workflows:
  ios-workflow:
    name: Wajbti iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: wajbti_asc
    environment:
      ios_signing:
        provisioning_profiles:
          - wajbti_app_store_profile
        certificates:
          - wajbti-distribution
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_APPLE_ID: 6807524821
      node: 22.11.0
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios
      - name: Register local native plugins
        script: |
          # `cap sync` only discovers plugin classes from npm-installed Capacitor
          # plugins - it has no way to see StepsPlugin.swift, which lives
          # directly in ios/App/App/ and isn't an npm package. Without this,
          # the JS side gets "plugin is not implemented on iOS" for it.
          node -e "
            const fs = require('fs');
            const path = 'ios/App/App/capacitor.config.json';
            const cfg = JSON.parse(fs.readFileSync(path, 'utf-8'));
            const list = new Set(cfg.packageClassList || []);
            list.add('StepsPlugin');
            cfg.packageClassList = Array.from(list);
            fs.writeFileSync(path, JSON.stringify(cfg, null, '\t'));
          "
      - name: Debug - show generated capacitor config
        script: |
          echo "----- capacitor.config.ts -----"
          cat capacitor.config.ts
          echo ""
          echo "----- ios/App/App/capacitor.config.json (generated) -----"
          cat ios/App/App/capacitor.config.json || echo "FILE NOT FOUND"
      - name: Increment build number
        script: |
          #!/usr/bin/env bash
          set -e
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number $APP_APPLE_ID)
          cd ios/App
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
