workflows:
  ios-workflow:
    name: Wajbti iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: wajbti_asc
    environment:
      ios_signing:
        provisioning_profiles:
          - wajbti_app_store_profile
        certificates:
          - wajbti-distribution
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 20.11.0
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all $CM_BUILD_NUMBER
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
