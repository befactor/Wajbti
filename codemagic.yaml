workflows:
  ios-workflow:
    name: Wajbti iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: wajbti_asc
    environment:
      ios_signing:
        provisioning_profiles:
          - wajbti_app_store_profile
        certificates:
          - wajbti-distribution
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_APPLE_ID: 6807524821
      node: 22.11.0
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios
      - name: Increment build number
        script: |
          #!/usr/bin/env bash
          set -e
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number $APP_APPLE_ID)
          cd ios/App
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
